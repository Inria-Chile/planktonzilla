# planktonzilla CI — runs on every push to main and every PR targeting main.
# 3 parallel jobs (lint, test, dep-isolation). Stand-up artifact of v1.1 Phase 8;
# dep-isolation guard added in Phase 9 (FND-04). The Phase 11 explorer-group view
# job was retired with the Gradio/Plotly views themselves — pz_sankey renders its
# own SVG and embeds its assets, so there is no viz group left to install.

name: CI

# 'on' is a YAML 1.1 boolean; quote the key so PyYAML / local validators don't
# coerce it to True. GitHub Actions accepts either form.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel in-flight runs when a new push lands on the same ref. Saves minutes
  # on rapid push cycles while still running on every PR head commit.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv (with cache)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          # Python is pinned by .python-version / pyproject.toml requires-python.
          # uv will resolve to 3.12 (the current devcontainer + HPC runtime).
          python-version: "3.13"

      # No `uv tool install ruff` here on purpose. ruff is a `dev` dependency pinned by
      # uv.lock, so `uv sync` below installs the SAME version a contributor gets from
      # `uv run ruff`. Installing it separately re-resolved it to whatever was newest at
      # that moment, which made lint depend on the date rather than on the diff: FURB192
      # is a preview rule in 0.15.8 and stable later, so a tree that was clean locally
      # failed here. Bump deliberately with `uv lock --upgrade-package ruff`.
      - name: Install project deps (uv sync)
        run: uv sync

      - name: Ruff version (the one uv.lock pins)
        run: uv run ruff --version

      - name: Ruff format --check (planktonzilla/, tests/)
        run: uv run ruff format --check planktonzilla/ tests/

      - name: Ruff check (planktonzilla/, tests/)
        run: uv run ruff check planktonzilla/ tests/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    # timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv (with cache)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install project deps (uv sync)
        run: uv sync

      # Excludes the slow HF Trainer / HF Hub integration matrices (per-combo
      # ~7 min runtime; would blow the per-job timeout). Keeps the FOCUS-01
      # axis tests, FOCUS-02 resolver tests, and the post-DEL-01 vendored
      # fixtures (which self-skip via skip_if_vendored_deleted).
      - name: Run pytest (excluding slow integration matrix)
        run: uv run pytest tests/ --ignore=tests/test_train.py --ignore=tests/test_datasets.py -v

  taxonomy-diff:
    name: Taxonomy diff (published cells)
    runs-on: ubuntu-latest
    # Only on PRs, and only when something under the taxonomy actually moved. A 2,358-line CSV
    # diff does not tell a reviewer whether a curation changed published data or only its
    # provenance; this posts the sentence that does. Step 9 of docs/TAXONOMY_IMPLEMENTATION_PLAN.md.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install project deps (uv sync)
        run: uv sync

      - name: Did the taxonomy change at all?
        id: touched
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- \
              planktonzilla/planktonzilla_dataset/taxonomy/ \
              planktonzilla/planktonzilla_dataset/planktonzilla_taxonomy.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The package renders the CSV, so "the package vs the base branch's CSV" is exactly
      # "what this PR would publish vs what is published today".
      - name: Render the base branch's CSV and diff the published cells
        if: steps.touched.outputs.changed == 'true'
        run: |
          git show "origin/${{ github.base_ref }}:planktonzilla/planktonzilla_dataset/planktonzilla_taxonomy.csv" > /tmp/base_taxonomy.csv
          {
            echo "### Taxonomy: published cells"
            echo
            uv run pz_taxonomy diff --summary --against /tmp/base_taxonomy.csv
            echo
            echo "_Provenance, vocabularies and identifier predicates are curation, not publication:"
            echo "they move without moving a published cell. \`pz_taxonomy check\` gates the rest._"
          } > /tmp/taxonomy_comment.md
          cat /tmp/taxonomy_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post it on the PR
        if: steps.touched.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: taxonomy-published-cells
          path: /tmp/taxonomy_comment.md
