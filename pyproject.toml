[project]
name = "planktonzilla"
version = "0.1.1"
description = "Deep learning methods for plankton identification"
authors = [{ name = "Inria Chile", email = "info@inria.cl" }]
license = "MIT"
readme = "README.md"
keywords = ["deep learning", "computer vision", "plankton images"]
requires-python = ">=3.11,<3.14"

dependencies = [
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "hydra-submitit-launcher>=1.2.0",
    "omegaconf>=2.3.0",
    "datasets>=4.4.0",
    "pyarrow",
    "transformers[sentencepiece]>=5.3.0",
    "wandb>=0.22.2",
    "tqdm>=4.67.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "open-clip-torch>=3.3.0,<4.0.0",
    "pyrootutils>=1.0.4",
    "rich>=14.2.0",
    "accelerate>=1.10.1",
    "timm>=1.0.20",
    "scikit-learn>=1.7.2",
    "humanize>=4.13.0",
    "peft>=0.18.1",
    "plotext>=5.3.2",
    "trackio>=0.18.0",
    "regex",
    "ftfy",
    "huggingface-hub",
    "safetensors",
    "webdataset>=0.2.5,<0.2.9",
    "pandas",
    "fsspec",
    "aiohttp",
    "polars>=1.41.2",
    "requests>=2.34.2",
    "joblib>=1.5.3",
    "biopython>=1.87",
    "orjson>=3.11.9",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
]

[project.urls]
homepage = "https://oceania.inria.cl/"
repository = "https://github.com/Inria-Chile/planktonzilla"
"Bug Tracker" = "https://github.com/Inria-Chile/planktonzilla/issues"

[project.scripts]
pz_import_dataset = 'planktonzilla.dataset_import.import_dataset:main'
pz_train = 'planktonzilla.train:main'
# Hydra front-end for the contrastive CLIP pretraining path: composes configs/train_clip.yaml,
# renders it to upstream open_clip_train CLI args, and launches. Under torchrun invoke the
# module (`torchrun ... -m planktonzilla.clip_train.hydra_main`) rather than this script.
pz_train_clip = 'planktonzilla.clip_train.hydra_main:main'
pz_planktonzilla = 'planktonzilla.planktonzilla_dataset.make_planktonzilla:main'
# DEPRECATED, removed in the next minor release: both are subsumed by pz_planktonzilla
# (full build == the bare command; taxonomy re-sync == base=hub sources=[]).
pz_generate_planktonzilla = 'planktonzilla.planktonzilla_dataset.generate_planktonzilla:main'
pz_update_planktonzilla = 'planktonzilla.planktonzilla_dataset.update_planktonzilla:main'
pz_sankey = 'planktonzilla.planktonzilla_dataset.sankey:main'
# External-authority verification of planktonzilla_taxonomy.csv. --report is network-free and
# is what CI runs (via tests/test_taxonomy_authority_crosschecks.py); --refresh-snapshot is the
# occasional network stage that re-harvests WoRMS / NCBI / Wikidata.
pz_verify_taxonomy = 'planktonzilla.planktonzilla_dataset.utils.verify_taxonomy_ids:main'

[dependency-groups]
dev = [
    "pytest",
    "notebook",
    "ipywidgets",
    "pytest-cov",
    "ipykernel",
    "matplotlib>=3.11.0",
    "cartopy>=0.25.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planktonzilla"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"planktonzilla/planktonzilla_dataset/templates/sankey_flow.html" = "planktonzilla/planktonzilla_dataset/templates/sankey_flow.html"

[tool.ruff]
line-length = 128
include = ["planktonzilla/**/*.py", "tests/**/*.py", "notebooks/**/*.ipynb", "notebooks/**/*.py"]
lint.select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle
    "W",
    "I",    # isort
    "N",    # pep8-naming
    "NPY",  # NumPy-specific rules
    "PERF", # Perflint
    "FURB", # refurb
    "PD",   # pandas-vet
    "RUF",  # Ruff-specific rules
]
lint.ignore = ["E402", "N806"]
# No per-file-ignores: the only entry was generate_sankey.py, which embedded its page as a
# raw-string template and needed an E501 exemption. pz_sankey keeps its page in
# templates/sankey_flow.html instead, so no Python file carries non-Python long lines.

[tool.pyright]
# Pylance/pyright configuration. Ruff is the linter of record; type checking is advisory
# here, so the rule families that only fire on this codebase's Hydra/OmegaConf idioms are
# muted project-wide instead of being papered over with per-line comments. Rules that can
# catch a real runtime failure stay on — silence those one line at a time with
# `# pyright: ignore[<rule>]` and a reason.
include = ["planktonzilla", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "data",
    "docs",
    "logs",
    "notebooks",
    "outputs",
    "scratchpad",
    "scripts",
]
# Resolve third-party imports against the uv-managed venv regardless of which interpreter
# the editor happens to have selected; without this every project dependency reads as
# "import could not be resolved".
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

# Hydra structured configs declare `field: str = None` (None is the "unset" sentinel, filled
# in from YAML at composition time), and config values reach call sites as `X | None` even
# though Hydra/OmegaConf guarantee them by then. Each of these fires only on that pattern.
reportArgumentType = "none"
reportAssignmentType = "none"
reportGeneralTypeIssues = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalCall = "none"
reportOptionalIterable = "none"
reportOptionalMemberAccess = "none"
reportOptionalOperand = "none"
reportOptionalSubscript = "none"

# Almost every hit is a bad third-party overload — polars `df[col][i]`, `torch.where`,
# `Tensor.type()`, `Module` attributes the stubs type as `Tensor` — plus the `@hydra.main`
# entry points, which are declared as taking a `cfg` the decorator injects.
reportCallIssue = "none"

# Stub gaps in unannotated dependencies: open_clip re-exports (TimmModel, VisionTransformer),
# hydra's compose/initialize, and torch tensors that the stubs widen to `float`.
reportAttributeAccessIssue = "none"
reportPrivateImportUsage = "none"
# requests/tqdm/yaml resolve to typeshed stubs rather than to their own sources.
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
# --doctest-modules removed: no doctests in planktonzilla/; testpaths=["tests"] alone is the gate. (INFRA-01, CONCERNS #13)
addopts = "--log-cli-format='%(asctime)s [%(levelname)7s] %(message)s (%(filename)s:%(lineno)s)' --log-cli-date-format='%Y-%m-%d %H:%M:%S'"
junit_family = "xunit2"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
norecursedirs = ".venv"
