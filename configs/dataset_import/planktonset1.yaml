hf_dataset_name: planktonset1.0
push_to_hub: true

human_readable_name: "PlanktonSet 1.0: Plankton imagery data collected from F.G. Walton Smith in Straits of Florida from 2014-06-03 to 2014-06-06 and used in the 2015 National Data Science Bowl (NCEI Accession 0127422)"
license: other
description: |
  Data presented here are subset of a larger plankton imagery data set collected in the subtropical Straits of 
  Florida from 2014-05-28 to 2014-06-14. Imagery data were collected using the In Situ Ichthyoplankton Imaging 
  System (ISIIS-2) as part of a NSF-funded project to assess the biophysical drivers affecting fine-scale 
  interactions between larval fish, their prey, and predators. This subset of images was used in the inaugural
  National Data Science Bowl (www.datasciencebowl.com) hosted by Kaggle and sponsored by Booz Allen Hamilton. 
  Data were originally collected to examine the biophysical drivers affecting fine-scale (spatial) interactions 
  between larval fish, their prey, and predators in a subtropical pelagic marine ecosystem. Image segments 
  extracted from the raw data were sorted into 121 plankton classes, split 50:50 into train and test data sets, 
  and provided for a machine learning competition (the National Data Science Bowl). There was no hierarchical 
  relationships explicit in the 121 plankton classes, though the class naming convention and a tree-like diagram 
  (see file "Plankton Relationships.pdf") indicated relationships between classes, whether it was taxonomic or 
  structural (size and shape). We intend for this dataset to be available to the machine learning and computer 
  vision community as a standard machine learning benchmark. This ''Plankton 1.0'' dataset is a medium-size 
  dataset with a fair amount of complexity where image classification improvements can still be made.

# NOT a stored file: this NCEI Archive Management System endpoint tars the accession ON
# DEMAND. Measured 2026-08-27 — ~22 s to first byte, then ~0.6 MB/s (so ~1 h for the full
# archive), Range IGNORED (a ranged GET answers 200, not 206), no Content-Length, and a
# sustained 503 when the service is busy. Nothing downstream can resume or size-check it,
# which is why this source failed repeatedly; PlanktonSet1DatasetImporter therefore fetches
# it through _fetch_archive_verified (one request per attempt, gzip-framing check, real
# retries) instead of the ordinary DownloadManager path.
download_uris: "https://www.ncei.noaa.gov/archive/archive-management-system/OAS/bin/prd/jquery/download/127422.2.3.tar.gz"
source_url: "https://www.ncei.noaa.gov/archive/archive-management-system/OAS/bin/prd/jquery/accession/download/127422"

# Fallback for when the generator is down. NOAA mirrors the SAME accession as a static,
# range-supporting tree (HEAD works, Accept-Ranges: bytes, exact per-file sizes) — but it
# publishes no tarball there, only the extracted files, so it is a human's route rather
# than a second automatic one. Surveyed 2026-08-27 over FTP: 121 class directories,
# 60,736 files, 108,723,866 bytes — matching the 121 classes and 60,736 images this
# source is documented to have.
#
# Fetching it whole is SLOW (~1.25 files/s on one FTP connection, i.e. ~13 h), so prefer
# retrying the generator unless it is persistently unavailable. Note that the HTTPS form
# of this mirror lives under a path ncei.noaa.gov/robots.txt disallows ("Disallow: /data*"),
# so bulk retrieval should go over FTP, which is the route the accession landing page
# itself advertises.
manual_download_url: "ftp://ftp-oceans.ncei.noaa.gov/nodc/archive/arc0075/0127422/2.3/"
manual_download_notes: |
  Preferred: retry the AMS download endpoint — it is intermittently 503 but serves the
  whole .tar.gz when up, and the importer now verifies and retries it.

  If it stays down, mirror the labeled tree from the static FTP copy and hand the result
  over as an archive of your own, e.g.:
    lftp -c "mirror -c --parallel=4 \
      ftp://ftp-oceans.ncei.noaa.gov/nodc/archive/arc0075/0127422/2.3/data/0-data/FINAL_Plankton_Segments_12082014 \
      ./FINAL_Plankton_Segments_12082014"
    tar czf 0127422.2.3.tar.gz FINAL_Plankton_Segments_12082014
  then:
    pz_import_dataset dataset_import=planktonset1 \
      dataset_import.manual_download_local_file_names=<abs path to 0127422.2.3.tar.gz>
  The importer locates the FINAL_Plankton_Segments_* directory anywhere in the archive,
  so the wrapping above does not have to match the accession's own layout.
