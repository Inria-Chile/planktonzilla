defaults:
  - default.yaml

_target_: planktonzilla.dataset_import.frepj_importer.FREPJDatasetImporter
hf_dataset_name: frepj
push_to_hub: false
check_image_file_integrity: true

human_readable_name: "FREPJ-Z: Freshwater Plankton in Japanese Lakes and Reservoirs (I. Zooplankton)"
license: "cc-by-4.0"
source_url: "https://jstagedata.jst.go.jp/articles/dataset/26891563"
download_uris: "https://ndownloader.figshare.com/files/48928918"
description: |
  FREPJ-Z: high-resolution microscopic images of freshwater zooplankton from Japanese
  lakes and reservoirs, organized into 229 taxon classes. Two magnifications (40x and
  100x) are merged into one class per taxon via magnification-prefixed filenames, and
  every image is normalized to RGB by decoded content. Released under CC BY 4.0.
citation_apa: |
