# @package _global_

model:
  _target_: planktonzilla.clip_model.ClipClassifier
  _args_:
    - ????
  # FIX-02: explicit dispatch field (replaces broad except: in train.py:165).
  # 'clip' routes to ClipClassifier; 'hf' routes to AutoModelForImageClassification.
  # See configs/model/default.yaml.
  type: clip

num_features: ???
img_size: ???
freeze_backbone: false

# Classification head: linear | cosine.
# `cosine` L2-normalises the feature and every class weight, so a logit is a pure cosine
# similarity times one shared temperature. A plain linear head lets class frequency show up
# as weight norm — head classes get more gradient pushing ||w_c|| up — which biases every
# imbalance-aware loss underneath. head_scale null uses CLIP's 1/0.07.
head_type: linear
head_scale: null
head_scale_learnable: true
