# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml

task_name: "generate_planktonzilla"
tags: ["dev"]

# HuggingFace Hub repo id for the consolidated dataset.
repo_id: project-oceania/planktonzilla-17M

# Opt-in Hub push, performed after the unconditional save_to_disk. When push_to_hub
# is true the consolidated dataset is pushed to repo_id; push_as_private sets the
# repo visibility and hf_token supplies the auth token (defaults to the HF_TOKEN env var).
push_to_hub: false
push_as_private: true
hf_token: ${oc.env:HF_TOKEN, null}

data_dir: ${paths.data_dir}

# Null defaults: the in-code fallbacks.
#   - taxonomy_csv_path -> constants.DEFAULT_TAXONOMY_CSV_FILENAME (a raw Path).
#   - num_proc          -> constants.default_num_proc().
taxonomy_csv_path: null
num_proc: null

# Source datasets to import + redefine, in build order (concatenation follows it).
# `redefiner` is a key into the REDEFINERS map in generate_planktonzilla.py
# (none -> NoMetadataRedefiner, whoi -> WHOIRedefiner, ecotaxa -> EcoTaxaRedefiner).
# Three sources are omitted here, long described as "requires a manual .zip download"
# because of anti-bot protection. Checked against the live services on 2026-08-01:
# NONE of them does.
#   - zoolake         direct `download_uris`, no manual override. Serves a 492 MB zip.
#   - jedioceans      direct `download_uris` that a manual override used to shadow;
#                     the override now defaults to null. Serves the expected nested
#                     CPICS_Validated/*.zip.
#   - sykezooscan2024 the one real case: no direct URL, because Fairdata packages on
#                     demand. Its importer resolves that via the Download API
#                     (`fairdata_pid`), verified end to end.
# Adding any of them here is a separate decision — jedioceans is CC-BY-SA-4.0, which
# does not combine with the CC-BY-NC-4.0 sources already in the table.
#
# Each entry carries THREE distinct identifiers — do not interchange them:
#   name        the source's identity. It is the `dataset` column value AND the
#               taxonomy CSV `Dataset` value, so it must match the CSV exactly.
#   import_name the configs/dataset_import/<stem>.yaml filename.
#   redefiner   a key into the REDEFINERS map above.
# For 4 of the 12 active entries name != import_name (whoi/whoi-plankton,
# zooscan/zooscannet, planktonset1.0/planktonset1, global_uvp5/global_uvp5net).
#
#   name             import_name          redefiner  archive
#   ---------------  -------------------  ---------  ------------------------------
#   jedioceans       jedi_oceans_cpics    jedi       CPICS_Validated.zip
#   sykezooscan2024  sykezooscan2024      none       SYKE-plankton_ZooScan_2024.zip
#   zoolake          zoolake              none       zoolake_data.zip
#
# To enable one, add an entry with an extra override, e.g.:
#   - {name: zoolake, import_name: zoolake, cleanup: true, redefiner: none,
#      extra_overrides: ["dataset_import.manual_download_local_file_names=${data_dir}/zoolake_data.zip"]}
datasets:
  - { name: isiisnet, import_name: isiisnet, cleanup: true, redefiner: none }
  - { name: whoi, import_name: whoi-plankton, cleanup: true, redefiner: whoi }
  - {
      name: flowcamnet,
      import_name: flowcamnet,
      cleanup: true,
      redefiner: ecotaxa,
    }
  - { name: lensless, import_name: lensless, cleanup: true, redefiner: none }
  - {
      name: medplanktonset,
      import_name: medplanktonset,
      cleanup: true,
      redefiner: none,
    }
  - { name: uvp6net, import_name: uvp6net, cleanup: true, redefiner: ecotaxa }
  - { name: zoocamnet, import_name: zoocamnet, cleanup: true, redefiner: none }
  - {
      name: zooscan,
      import_name: zooscannet,
      cleanup: true,
      redefiner: ecotaxa,
    }
  - {
      name: planktonset1.0,
      import_name: planktonset1,
      cleanup: false,
      redefiner: none,
    }
  - {
      name: syke_ifcb_2022,
      import_name: syke_ifcb_2022,
      cleanup: false,
      redefiner: none,
    }
  - {
      name: planktoscope,
      import_name: planktoscope,
      cleanup: false,
      redefiner: ecotaxa,
    }
  - {
      name: global_uvp5,
      import_name: global_uvp5net,
      cleanup: false,
      redefiner: ecotaxa,
    }
