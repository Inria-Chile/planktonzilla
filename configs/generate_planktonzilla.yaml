# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml

task_name: "generate_planktonzilla"
tags: ["dev"]

# HuggingFace Hub repo id for the consolidated dataset.
repo_id: project-oceania/planktonzilla-17M

# Opt-in Hub push, performed after the unconditional save_to_disk. When push_to_hub
# is true the consolidated dataset is pushed to repo_id; push_as_private sets the
# repo visibility and hf_token supplies the auth token (defaults to the HF_TOKEN env var).
push_to_hub: false
push_as_private: true
hf_token: ${oc.env:HF_TOKEN, null}

data_dir: ${paths.data_dir}

# Null defaults: the in-code fallbacks.
#   - taxonomy_csv_path -> constants.DEFAULT_TAXONOMY_CSV_FILENAME (a raw Path).
#   - num_proc          -> constants.default_num_proc().
taxonomy_csv_path: null
num_proc: null

# Source datasets to import + redefine, in build order (concatenation follows it).
# `redefiner` is a key into the REDEFINERS map in generate_planktonzilla.py
# (none -> NoMetadataRedefiner, whoi -> WHOIRedefiner, ecotaxa -> EcoTaxaRedefiner).
# Three sources were long described as "requires a manual .zip download" because of
# anti-bot protection. Checked against the live services on 2026-08-01: NONE of them
# does, and all three are now active entries at the end of the table.
#
# `sykezooscan2024` was the only one needing real work — Fairdata packages it on demand
# rather than serving a direct URL — which its importer resolves through the Download API
# (`fairdata_pid`).
#
# The registry therefore covers all 15 sources of the published dataset — a from-scratch
# build reproduces it, rather than 12 of its 15 parts — plus two appended after them that
# enter the published artifact later: `frepj` (v1.2) and `daplankton`.
#
# Each entry carries THREE distinct identifiers — do not interchange them:
#   name        the source's identity. It is the `dataset` column value AND the
#               taxonomy CSV `Dataset` value, so it must match the CSV exactly.
#   import_name the configs/dataset_import/<stem>.yaml filename.
#   redefiner   a key into the REDEFINERS map above.
# For 5 of the 17 active entries name != import_name (whoi/whoi-plankton,
# zooscan/zooscannet, planktonset1.0/planktonset1, global_uvp5/global_uvp5net,
# jedioceans/jedi_oceans_cpics).
#
# If one of the downloads breaks upstream, fall back to a hand-fetched archive without
# removing the source from this table — `pz_planktonzilla dry_run=true` reports the exact
# path and URL for anything still missing:
#   - {name: zoolake, import_name: zoolake, cleanup: false, redefiner: none,
#      extra_overrides: ["dataset_import.manual_download_local_file_names=${data_dir}/manual_downloads/zoolake_data.zip"]}
datasets:
  - { name: isiisnet, import_name: isiisnet, cleanup: true, redefiner: none }
  - { name: whoi, import_name: whoi-plankton, cleanup: true, redefiner: whoi }
  - {
      name: flowcamnet,
      import_name: flowcamnet,
      cleanup: true,
      redefiner: ecotaxa,
    }
  - { name: lensless, import_name: lensless, cleanup: true, redefiner: none }
  - {
      name: medplanktonset,
      import_name: medplanktonset,
      cleanup: true,
      redefiner: none,
    }
  - { name: uvp6net, import_name: uvp6net, cleanup: true, redefiner: ecotaxa }
  - { name: zoocamnet, import_name: zoocamnet, cleanup: true, redefiner: none }
  - {
      name: zooscan,
      import_name: zooscannet,
      cleanup: true,
      redefiner: ecotaxa,
    }
  - {
      name: planktonset1.0,
      import_name: planktonset1,
      cleanup: false,
      redefiner: none,
    }
  - {
      name: syke_ifcb_2022,
      import_name: syke_ifcb_2022,
      cleanup: false,
      redefiner: none,
    }
  - {
      name: planktoscope,
      import_name: planktoscope,
      cleanup: false,
      redefiner: ecotaxa,
    }
  - {
      name: global_uvp5,
      import_name: global_uvp5net,
      cleanup: false,
      redefiner: ecotaxa,
    }
  # Appended, not inserted: registry order is the concatenation order of the output, so
  # adding these at the end leaves every existing source at the index it already had.
  # Both download automatically (checked 2026-08-01); cleanup:false keeps the large raw
  # archives (zoolake is 492 MB) for reuse across runs.
  - { name: zoolake, import_name: zoolake, cleanup: false, redefiner: none }
  # NOTE: jedioceans is CC-BY-SA-4.0. It is the only ShareAlike source here, and it does
  # not combine with the five CC-BY-NC-4.0 sources above into a single redistributable
  # licence — see the Licensing section of the README. Per-image `license` /
  # `license_url` columns record each row's terms, which is what makes the mix tractable.
  - {
      name: jedioceans,
      import_name: jedi_oceans_cpics,
      cleanup: false,
      redefiner: jedi,
    }
  # Resolves its archive through the Fairdata Download API (`fairdata_pid`) rather than a
  # direct URL — verified end to end on 2026-08-01: 20 class folders / 22,753 images,
  # matching its 20 taxonomy CSV labels exactly. cc-by-4.0, so it adds nothing new to the
  # licence mix. With this entry the registry covers all 15 sources of the published
  # dataset, so a from-scratch build reproduces it (the frepj entry below is the one
  # source the published 17M does not hold yet).
  - {
      name: sykezooscan2024,
      import_name: sykezooscan2024,
      cleanup: false,
      redefiner: none,
    }
  # Sixteenth (milestone v1.2): appended so the fifteen sources of the published
  # planktonzilla-17M keep the concatenation index they already had. cc-by-4.0, so the
  # licence mix is unchanged. Besides its 963 MB figshare archive, its redefiner joins
  # three md5-pinned sidecar tables (Table_S1/S3/S4, 8.6 MB, figshare article 26891563)
  # and the committed site crosswalk. The importer fetches the tables into
  # <data_dir>/frepj_tables on any run that lacks them, before the first import — no
  # manual step. `dry_run=true` reports them as sidecars:frepj; `check_downloads` probes
  # them under download:frepj. A verified table is never re-fetched, refresh=redownload
  # included: delete the file to force one. cleanup:false keeps the raw archive for
  # reuse, like the three entries above.
  - { name: frepj, import_name: frepj, cleanup: false, redefiner: frepj }
  # Seventeenth: appended after frepj so every source above keeps the
  # concatenation index it already had. cc-by-4.0, so the licence mix is unchanged.
  #
  # Like sykezooscan2024 it resolves its archive through the Fairdata Download API
  # (`fairdata_pid`) rather than a direct URL — verified end to end on 2026-08-27: the
  # 2,739,982,748-byte package downloaded and matched the sha256 the API declares, and its
  # 44 merged class folders / 111,924 images match the 44 `daplankton` labels in
  # planktonzilla_taxonomy.csv exactly.
  #
  # The archive is DOUBLY nested (the package holds DAPlankton/DAPlankton.zip, itself the
  # real archive) and the importer unwraps both, so budget ~9 GB free under data_dir for a
  # from-scratch import. cleanup:false keeps the raw copies for reuse, like the four entries
  # above; set it true if that disk is wanted back.
  - { name: daplankton, import_name: daplankton, cleanup: false, redefiner: none }
  # Entries 18-21 (milestone v1.2): the four Tara Pacific deposits of Mériguet et al. 2025
  # (essd-17-2761-2025), appended last so every source above keeps its concatenation index.
  # All four are cc-by-4.0, so the licence mix is unchanged.
  #
  # These are the only sources with NO archive. Their SEANOE deposits publish EcoTaxa TSV
  # exports — per-object metadata and morphological features, no vignettes — and point at
  # public EcoTaxa projects for the images, which is what the importer walks: a per-object
  # manifest from the read API, then one vignette per object from the vault. Both are
  # declared as SIDECARS, so `dry_run=true` reports them under `sidecars:` and
  # `check_downloads` probes the EcoTaxa endpoints; the manifests land in
  # <data_dir>/tara_pacific_manifests and are reused until deleted (or until
  # refresh=redownload). `redefiner: tara_pacific` reads those same manifests offline, so
  # the redefine step makes ZERO requests — unlike `redefiner: ecotaxa`, which would issue
  # one per image, i.e. 2.35 million for these four.
  #
  # They are large: ~2.35 M objects in total, decknet alone ~1.58 M. cleanup:false, like
  # the entries above, so a re-run reuses what is already on disk.
  - {
      name: tara_pacific_bongo,
      import_name: tara_pacific_bongo,
      cleanup: false,
      redefiner: tara_pacific,
    }
  - {
      name: tara_pacific_decknet,
      import_name: tara_pacific_decknet,
      cleanup: false,
      redefiner: tara_pacific,
    }
  - {
      name: tara_pacific_hsn,
      import_name: tara_pacific_hsn,
      cleanup: false,
      redefiner: tara_pacific,
    }
  # The only source whose label space includes anthropogenic microplastics, from the
  # separate EcoTaxa plastics project 1345 alongside the plankton project 1344.
  - {
      name: tara_pacific_manta,
      import_name: tara_pacific_manta,
      cleanup: false,
      redefiner: tara_pacific,
    }
