# @package _global_

# Base experiment config. Every `base_*.yaml` in this group inherits it, so the keys here must
# all resolve — a dead interpolation breaks every experiment at once, which is what happened
# before: `experiment_metadata` referenced `model.net.model_name`, `model.criterion._target_`
# and `dataset.sampler_type`, none of which any config defines. They are PyTorch-Lightning-era
# names that outlived the migration to the Hugging Face `Trainer`, and they took the whole
# group down with them (see docs/CODE_REVIEW.md finding 1.10).
#
# Run one with:
#   pz_train experiment=base_lensless
#
# `experiment_metadata` is live: `planktonzilla.utils.hydra` logs each entry as a tracked
# hyperparameter, so anything added here shows up beside the run's metrics. Add only keys that
# some config actually defines — `pz_train experiment=default` is the check.

defaults:
  - override /dataset: default.yaml
  - override /model: resnet18.yaml
  - override /augmentation: default.yaml
  - override /training_arguments: default.yaml
  - override /tracking: default.yaml

experiment_metadata:
  dataset: ${strip_yaml_suffix:${hydra:runtime.choices.dataset}}
  model_name: ${strip_yaml_suffix:${hydra:runtime.choices.model}}
  augmentation_name: ${strip_yaml_suffix:${hydra:runtime.choices.augmentation}}
  loss: ${custom_loss._target_}
  head_type: ${head_type}
  precision: ${precision}
