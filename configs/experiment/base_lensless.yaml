# @package _global_

# Run with:
#   pz_train experiment=base_lensless
#
# Inherits configs/experiment/default.yaml.
# Dropped a `model.optimizer` block: `cfg.model` is splatted into the model constructor by
# hydra.utils.instantiate, so a stray key there is passed as a kwarg, not ignored. Optimizer
# settings belong in the `training_arguments` group.

defaults:
  - default.yaml
  - override /dataset: lensless.yaml
  - override /augmentation: default.yaml
