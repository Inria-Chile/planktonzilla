# @package _global_

# Run with:
#   pz_train experiment=base_cifar10
#
# Inherits configs/experiment/default.yaml.
# Smoke-test corpus, not plankton. augmentation was `none.yaml`, which does not exist;
# `default.yaml` is the no-augmentation member (it sets `augmentation: null`), so this is
# the same intent under the name that exists.

defaults:
  - default.yaml
  - override /dataset: cifar10.yaml
  - override /augmentation: default.yaml
