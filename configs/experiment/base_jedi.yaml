# @package _global_

# Run with:
#   pz_train experiment=base_jedi
#
# Inherits configs/experiment/default.yaml.
# augmentation was `jedi.yaml` — no such member; there are no per-dataset augmentation
# configs in this repo. Falls back to `default.yaml` (no augmentation).

defaults:
  - default.yaml
  - override /dataset: jedi_oceans.yaml
  - override /augmentation: default.yaml
