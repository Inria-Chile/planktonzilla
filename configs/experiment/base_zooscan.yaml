# @package _global_

# Run with:
#   pz_train experiment=base_zooscan
#
# Inherits configs/experiment/default.yaml.
# dataset was `zooscan.yaml`; the member is named `zooscannet.yaml`. augmentation was
# `zooscan.yaml` — no such member, so `default.yaml` (no augmentation).

defaults:
  - default.yaml
  - override /dataset: zooscannet.yaml
  - override /augmentation: default.yaml
