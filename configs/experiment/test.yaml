# @package _global_

# Fast smoke run — a single short epoch over CIFAR-10, for checking that the training path
# executes end to end. Not a plankton experiment and not a benchmark.
#
#   pz_train experiment=test
#
# Previously this referenced `model/timm-resnet18`, `augmentation/none` and
# `tracking/many_loggers` (none of which exist) and carried a PyTorch-Lightning-era body —
# `trainer.max_epochs`, `datamodule.dataset_size`, `model.criterion` — that the Hugging Face
# `Trainer` path does not read. Epoch count now goes through `training_arguments`, which is
# where this project's trainer actually looks.

defaults:
  - default.yaml
  - override /dataset: cifar10.yaml
  - override /model: resnet18.yaml
  - override /augmentation: default.yaml
  - override /training_arguments: default.yaml
  - override /tracking: default.yaml

training_arguments:
  num_train_epochs: 1
