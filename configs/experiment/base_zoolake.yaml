# @package _global_

# Run with:
#   pz_train experiment=base_zoolake
#
# Inherits configs/experiment/default.yaml.
# augmentation was `zoolake.yaml` — no such member, so `default.yaml` (no augmentation).

defaults:
  - default.yaml
  - override /dataset: zoolake.yaml
  - override /augmentation: default.yaml
