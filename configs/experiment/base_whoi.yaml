# @package _global_

# Run with:
#   pz_train experiment=base_whoi
#
# Inherits configs/experiment/default.yaml.
# dataset was `whoi.yaml`; the member is named `whoi-plankton.yaml`. augmentation was
# `whoi.yaml` — no such member, so `default.yaml` (no augmentation).

defaults:
  - default.yaml
  - override /dataset: whoi-plankton.yaml
  - override /augmentation: default.yaml
