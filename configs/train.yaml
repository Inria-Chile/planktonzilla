# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - model: resnet18.yaml 
  - dataset: lensless.yaml
  - training_arguments: default.yaml
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml
  - augmentation: default.yaml
  - tracking: default.yaml
  - custom_loss: default.yaml
  - peft: default.yaml

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default.yaml

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null
  - override hydra/help: planktonzilla-help

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
# appending lists from command line is currently not supported :(
# https://github.com/facebookresearch/hydra/issues/1547
tags: ["dev"]

# provide checkpoint path to resume training
resume_from_ckpt_path: null

# Hugging Face hub config
# hf_token: ${oc.env:HF_TOKEN, null}
model_push_to_hub: false
model_push_to_hub_org_name: project-oceania
model_push_to_hub_repo_name_prefix: pz # names of uploaded models will have this prefix
model_push_as_private: true

# Mixed-precision mode: auto | bf16 | fp16 | fp32 | null.
#   auto  -> bf16 where the GPU supports it (Ampere+), fp16 where it does not, fp32 on CPU.
#   fp16  -> reproduces the previous default exactly.
#   null  -> leave training_arguments.bf16/fp16 untouched, for full manual control.
# bf16 keeps fp32's exponent range at fp16's memory cost, which matters because every loss in
# planktonzilla.loss is built from log/exp/pow — where fp16 overflows to inf and underflows to
# NaN. It needs Ampere or newer, hence `auto` rather than a hard flip.
precision: auto

# Evaluation metrics.
# eval_top_k also bounds what evaluation accumulates in memory: Trainer concatenates the
# per-batch predictions across the whole eval set, so the top-k indices are kept instead of
# the full (n_eval, n_classes) logit matrix. Raising it costs memory linearly.
eval_top_k: 5
# Long-tail shot-group boundaries, in TRAINING images per class:
#   few-shot    < 20
#   medium-shot   20..100
#   many-shot   > 100
# Each group reports the mean of its per-class recalls, so a change that helps the tail at
# a small cost to the head is distinguishable from noise in macro-F1.
eval_shot_thresholds: [20, 100]

# Seed for random number generators in pytorch, numpy and python.random
seed: ${dataset.split_seed}

# Whether to use deterministic algorithms where available. Can slow down training.
deterministic: false

# ABSORB-02: enable TF32 matmul on Ampere+ GPUs (vendored open_clip_train's default
# per docs/open_clip_audit.md Q6 — was not reproduced by pz_train before Phase 4).
# Opt-in to preserve pre-refactor strict reproducibility; set to true for the
# throughput characteristics the vendored open_clip_train pipeline had.
tf32: false
