template: |-
  ${hydra.help.header}

  Create or update the consolidated planktonzilla dataset. One command; the run is
  described by three orthogonal parameters:

    base            where already-built rows come from   null | hub | local | <path>
    sources         which sources are rebuilt now        all  | []   | [whoi]
    sync_taxonomy   re-apply the CSV to carried rows     true | false

  The output holds exactly one contribution per source — freshly built for the
  sources in `sources`, carried over from `base` for the rest — in the `datasets`
  declaration order.

  Examples:
    pz_planktonzilla                                             # full build (default)
    pz_planktonzilla push_to_hub=true
    pz_planktonzilla base=hub   sources=[]                       # taxonomy CSV changed
    pz_planktonzilla base=local sources=[whoi] refresh=redownload
    pz_planktonzilla base=local sources=[whoi,zooscan] refresh=redownload num_proc=8
    pz_planktonzilla base=hub   sources=[whoi] dry_run=true      # pre-flight, touches nothing
    pz_planktonzilla dry_run=true check_downloads=all            # ...and probe every download
    pz_planktonzilla sources=[lensless] output_dir=/scratch/pz   # single-source dev build
    pz_planktonzilla version=1.4.0 push_to_hub=true              # stamp + tag a release

  dry_run= resolves the plan and checks its local prerequisites — the taxonomy CSV, a
  `base` on disk, the directories it would write, every hand-downloaded archive.
  check_downloads= adds the network ones and is independent of it:

    none    nothing (default); the local checks still run
    needed  probe every file THIS run would fetch, plus the Hub endpoints it would use
    all     also probe the sources whose imagefolder is already built

  One HEAD per URL (falling back to a one-byte ranged GET for the hosts that refuse
  HEAD), the Fairdata API read-only, the Hub base, write access to the push target, and
  whether version= is already a tag — a collision that otherwise only surfaces after the
  whole dataset has been uploaded. Nothing is downloaded, written or POSTed. Anything
  blocking is raised as one summarised error, so this doubles as a CI gate; on a REAL run
  check_downloads= makes it refuse to start rather than fail four sources in — but only
  over a source that run would actually fetch, never one it reuses from disk.

  version= is embedded in the artifact as DatasetInfo.version (needs the x.y.z form)
  and pushed as a Hub git tag after a successful push (free-form). It is validated
  before any build work, so a malformed version fails in seconds, not hours.

  Source names are the `name` field of the `datasets` entries (whoi, zooscan,
  planktonset1.0, global_uvp5), not the import config stems.

  Compose your configuration from these options:

  $APP_CONFIG_GROUPS

  $HYDRA_CONFIG_GROUPS

  == Current (default) config ==

  $CONFIG
  ${hydra.help.footer}
