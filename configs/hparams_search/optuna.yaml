# @package _global_

# Hyperparameter optimization with Optuna.
#
#   uv run pz_train -m hparams_search=optuna experiment=<name>
#
# REQUIRES TWO PACKAGES THIS PROJECT DOES NOT DEPEND ON: `optuna` and
# `hydra-optuna-sweeper`. Without them this config does not even COMPOSE — Hydra fails with
# "Could not find 'hydra/sweeper/optuna'", which names the sweeper rather than the missing
# install. Add both to the environment first:
#
#   uv pip install optuna hydra-optuna-sweeper
#
# Pinned as a strict xfail in tests/test_experiment_protocol.py so the gap stays visible
# rather than being discovered at the start of a sweep.

defaults:
  - override /hydra/sweeper: optuna

# The metric Optuna optimizes. `build_compute_metrics` (planktonzilla/train.py) returns
# accuracy / f1 / precision / recall / top5_accuracy, and the HF Trainer prefixes each with
# `eval_`. The previous value, "valid/MulticlassAccuracy", was a PyTorch-Lightning name that
# nothing in this project logs — the sweep would have optimized a metric that never appears.
optimized_metric: "eval_accuracy"

# here we define Optuna hyperparameter search
# it optimizes for value returned from function with @hydra.main decorator
# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
  mode: "MULTIRUN" # set hydra to multirun by default if this config is attached

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    # storage URL to persist optimization results
    # for example, you can use SQLite if you set 'sqlite:///example.db'
    storage: null

    # name of the study to persist optimization results
    study_name: null

    # number of parallel workers
    n_jobs: 1

    # 'minimize' or 'maximize' the objective
    direction: maximize

    # total number of runs that will be executed
    n_trials: 15

    # choose Optuna hyperparameter sampler
    # you can choose bayesian sampler (tpe), random search (without optimization), grid sampler, and others
    # docs: https://optuna.readthedocs.io/en/stable/reference/samplers.html
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 5 # number of random sampling runs before optimization starts

    # Search space, in THIS project's keys. The previous entries — `model.optimizer._target_`,
    # `model.lr`, `datamodule.batch_size` — are PyTorch-Lightning template keys that no config
    # here defines: `cfg.model` is an AutoModelForImageClassification.from_pretrained spec with
    # no optimizer or lr, and there is no datamodule. Optuna would have swept keys that do not
    # exist. Optimizer choice belongs to `training_arguments.optim` (a transformers enum), not
    # to a torch _target_. Every key below is present in configs/training_arguments/default.yaml:
    # under Hydra's struct mode an override of an absent key fails, so a sweep over a plausible
    # but undeclared field (warmup_ratio, say) would die the same way the old keys did.
    params:
      training_arguments.learning_rate: interval(0.00001, 0.001)
      training_arguments.per_device_train_batch_size: choice(16, 32, 64)
      training_arguments.weight_decay: interval(0.0, 0.1)
